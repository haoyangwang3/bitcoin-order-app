name: "sast-scan"

on:
  push:
    branches:
      - githubcicd

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --force

      - name: Install OWASP Dependency-Check
        run: |
          VERSION=$(curl -s https://dependency-check.github.io/DependencyCheck/current.txt)
          echo "Using Dependency-Check version $VERSION"
          curl -Ls \
            "https://github.com/dependency-check/DependencyCheck/releases/download/v$VERSION/dependency-check-$VERSION-release.zip" \
            -o dependency-check.zip
          unzip -q dependency-check.zip

      - name: Run scan with ODC
        run: |
          dependency-check/bin/dependency-check.sh \
            --project "bitcoin" \
            --scan . \
            --format HTML \
            --out odc-report \
            --disableOssIndex

      - name: Archive SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: odc-report/
          if-no-files-found: warn
